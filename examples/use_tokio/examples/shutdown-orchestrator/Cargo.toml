[package]
name = "shutdown-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
tokio = { version = "1.52.3", features = [
  "signal",
  "rt-multi-thread",
  "macros",
  "time",
] }
tokio-util = "0.7.18"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
